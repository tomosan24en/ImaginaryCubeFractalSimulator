<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
                "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.webgpu.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/",
                "scripts/imaginary-cone-fractal": "./scripts/imaginary-cone-fractal.js",
                "scripts/imaginary-H": "./scripts/imaginary-H.js",
                "scripts/imaginary-T": "./scripts/imaginary-T.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from "three/webgpu";
        import { ImaginaryConeFractal } from "scripts/imaginary-cone-fractal";
        import { ImaginaryH } from "scripts/imaginary-H";
        import { ImaginaryT } from "scripts/imaginary-T";

        const width = 600;
        const height = 600;
        const canvas = document.querySelector("#myCanvas");

        const renderer = new THREE.WebGPURenderer({
            canvas: canvas,
        });
        renderer.setPixelRatio(devicePixelRatio);
        renderer.setSize(width, height);

        const projects = new Map();
        projects.set("imaginary-cone-fractal", new ImaginaryConeFractal());
        projects.set("imaginary-H", new ImaginaryH());
        projects.set("imaginary-T", new ImaginaryT());

        let selected = "imaginary-cone-fractal";

        projects.forEach((value, key) => {
            const projButton = document.getElementById(key);
            projButton.addEventListener("click", (event) => {
                projects.get(selected).dispose();
                selected = key;
                projects.get(selected).init(width, height, canvas);
            });
        });

        projects.get(selected).init(width, height, canvas);
        renderer.setAnimationLoop(() => {projects.get(selected).tick(renderer)});
    </script>
</head>
<body>
    <canvas id="myCanvas"></canvas>
    <div>
        <button id="imaginary-cone-fractal">正四面体フラクタル</button>
        <button id="imaginary-H">H型イマジナリーキューブ</button>
        <button id="imaginary-T">T型イマジナリーキューブ</button>
    </div>
</body>
</html>
